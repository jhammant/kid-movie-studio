<title>Robots Revenge Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a TV gallery wall. Each choice is a row of "monitors"; picking one lights its tally. Deliberately one dark broadcast look. */
:root {
  color-scheme: dark;
  --bg: #0c1424;
  --panel: #142039;
  --bezel: #1d2b4a;
  --line: #2b3d63;
  --fg: #eef2fb;
  --muted: #a3b2d1;
  --onair: #ef3b36;
  --tally: #ffc83d;
  --tally-ink: #241a00;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0 96px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 40px; }

header { display: grid; gap: 10px; padding-block: 28px 4px; }
.onair {
  display: inline-flex; align-items: center; gap: 8px; width: fit-content;
  font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.12em;
  color: var(--onair); border: 2px solid var(--onair); border-radius: 4px; padding: 2px 10px;
}
.onair i { width: 9px; height: 9px; border-radius: 50%; background: var(--onair); animation: blink 1.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 62ch; margin: 0; font-size: 1.08rem; }

section { display: grid; gap: 16px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
.sec-head h2 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 0; letter-spacing: 0.02em; }
.sec-head p { margin: 0; color: var(--muted); }
.sec-head .slot { margin-left: auto; font-weight: 700; color: var(--tally); }

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.card {
  display: grid; gap: 10px; align-content: start; min-width: 0;
  background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 12px;
  position: relative; transition: border-color 0.15s;
}
.card.picked { border-color: var(--tally); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tally) 30%, transparent); }
.screen {
  aspect-ratio: 16 / 9; max-width: 100%; width: 100%;
  background: #000; border: 6px solid var(--bezel); border-radius: 6px; overflow: hidden;
  display: grid; place-items: center;
}
.screen video { width: 100%; height: 100%; display: block; background: #000; }
.pending { color: var(--muted); font-size: 0.95rem; text-align: center; padding: 12px; display: grid; gap: 6px; justify-items: center; }
.pending .bars { display: flex; gap: 4px; }
.pending .bars span { width: 8px; height: 18px; background: var(--line); animation: pulse 1.2s ease-in-out infinite; }
.pending .bars span:nth-child(2) { animation-delay: 0.15s; }
.pending .bars span:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 50% { background: var(--muted); } }
.label { display: flex; gap: 10px; align-items: baseline; }
.letter { font-family: var(--display); font-size: 1.3rem; color: var(--tally); }
.name { font-weight: 700; font-size: 1.12rem; }
.desc { margin: 0; color: var(--muted); }
.pick {
  font: 700 1rem var(--body); cursor: pointer;
  border: 2px solid var(--tally); color: var(--tally); background: transparent;
  border-radius: 999px; padding: 10px 16px; min-height: 44px;
}
.pick:hover { background: color-mix(in srgb, var(--tally) 14%, transparent); }
.pick:focus-visible, textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.card.picked .pick { background: var(--tally); color: var(--tally-ink); }
.stamp {
  position: absolute; top: -12px; right: 12px; display: none;
  font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.08em;
  background: var(--tally); color: var(--tally-ink); padding: 3px 10px; border-radius: 4px; transform: rotate(3deg);
}
.card.picked .stamp { display: block; }

.done { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.done li { display: flex; gap: 10px; align-items: baseline; }
.done li b { color: var(--tally); font-family: var(--display); font-weight: 400; font-size: 0.85rem; letter-spacing: 0.06em; flex: none; }
label[for="note"] { font-weight: 700; }
textarea {
  width: 100%; min-height: 96px; resize: vertical; font: 1rem var(--body);
  color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px;
}

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  border-top: 2px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.dock-in { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.chip { font-weight: 700; }
.chip span { color: var(--muted); font-weight: 400; }
.status { margin-left: auto; color: var(--muted); font-size: 0.9rem; }
@media (prefers-reduced-motion: reduce) { .onair i, .pending .bars span { animation: none; } }
</style>

<div class="wrap">
  <header>
    <span class="onair"><i></i>ON AIR</span>
    <h1>Robots Revenge</h1>
    <p class="lede">Director: watch each preview, then press <b>Pick</b> on your favourite. Your picks save straight away, and the studio builds the final film from them.</p>
  </header>

  <div id="sections"></div>

  <section aria-labelledby="note-h">
    <div class="sec-head"><h2 id="note-h">Anything to change?</h2><p>Ideas, fixes, other words for the titles.</p></div>
    <label for="note">Note for Claude</label>
    <textarea id="note" placeholder="e.g. make the title more sparkly, call the channel something else…"></textarea>
  </section>
</div>

<div class="dock" role="status" aria-live="polite">
  <div class="dock-in">
    <div class="chip"><span>Title </span><span id="d-title">–</span></div>
    <div class="chip"><span>Channel </span><span id="d-channel">–</span></div>
    <div class="chip"><span>Cut-out </span><span id="d-signal">–</span></div>
    <div class="chip"><span>Voice </span><span id="d-voice">–</span></div>
    <div class="status" id="status">Picks save automatically</div>
  </div>
</div>

<script>
// Each preview's src is filled in as its render finishes; null shows "still rendering".
const SECTIONS = [
  { key: "title", n: "1", heading: "Opening title card", blurb: "The very first thing on screen.", options: [
    { id: "A", name: "Blockbuster", desc: "Chrome letters, sparks and a deep cinema BWAAAM.", src: "v/title-a.mp4" },
    { id: "B", name: "Comic book", desc: "Bright halftone dots, bouncy letters and a KA-POW!", src: "v/title-b.mp4" },
    { id: "C", name: "Robot computer", desc: "Green computer screen typing itself out, with beeps and boops.", src: "v/title-c.mp4" },
    { id: "D", name: "Warning siren", desc: "Flashing hazard stripes, a siren, then the title slams in.", src: "v/title-d.mp4" },
  ]},
  { key: "channel", n: "2", heading: "News channel name", blurb: "Shown in the 9 o'clock news intro, with the clock and the pips.", options: [
    { id: "A", name: "SBC News", desc: "The Sam Broadcasting Corporation, named after the director.", src: "v/channel-a.mp4" },
    { id: "B", name: "Robot Watch 9", desc: "A channel that only reports on robots.", src: "v/channel-b.mp4" },
    { id: "C", name: "The Nine O'Clock News", desc: "No channel name, just the programme title.", src: "v/channel-c.mp4" },
    { id: "D", name: "Penny Sparks Live", desc: "Named after the star reporter.", src: "v/channel-d.mp4" },
  ]},
  { key: "signal", n: "3", heading: "Signal cut-out", blurb: "What happens when the robot stomps on the camera.", options: [
    { id: "A", name: "Glitch, static and BEEEP", desc: "Picture breaks up, BZZZZ static, then colour bars and “We apologise for the loss of signal”.", src: "v/signal-a.mp4" },
    { id: "B", name: "Robots hacked it", desc: "Glitch and static, then a red ERROR screen: broadcast taken over by robots.", src: "v/signal-b.mp4" },
    { id: "C", name: "Just static", desc: "Short and punchy: glitch, two seconds of BZZZZ, straight back to Rex.", src: "v/signal-c.mp4" },
  ]},
  { key: "voice", n: "4", heading: "Robot voice", blurb: "The little robot at the very end: “We'll see, Penny… We'll see…”. Turn the sound up!", options: [
    { id: "A", name: "Deep and slow", desc: "A deep, calm, menacing voice with a slight metal buzz. Says “Penny” clearly.", src: "v/voice-a.mp4" },
    { id: "B", name: "Classic robot", desc: "Old-school computer voice with a metal ring. The name is a bit fuzzy.", src: "v/voice-b.mp4" },
    { id: "C", name: "Creepy whisper", desc: "Deep voice with a breathy ghost whisper underneath. The name is a bit fuzzy.", src: "v/voice-c.mp4" },
    { id: "D", name: "Glitchy evil", desc: "Crunchy, glitchy evil robot. Says “Penny” clearly.", src: "v/voice-d.mp4" },
    { id: "E", name: "Monster chorus", desc: "Three deep voices at once, like a robot army. The name is a bit fuzzy.", src: "v/voice-e.mp4" },
    { id: "F", name: "Sinister original", desc: "Slow and sinister with a dark echo. It's the one in the clip now, and says “Penny” clearly.", src: "v/voice-f.mp4" },
  ]},
];

const picks = { title: null, channel: null, signal: null, voice: null, note: "" };
const root = document.getElementById("sections");
const statusEl = document.getElementById("status");

function optionName(key, id) {
  const s = SECTIONS.find(x => x.key === key);
  const o = s && s.options.find(x => x.id === id);
  return o ? `${o.id} · ${o.name}` : "–";
}

function build() {
  for (const s of SECTIONS) {
    const sec = document.createElement("section");
    sec.setAttribute("aria-labelledby", `h-${s.key}`);
    sec.innerHTML = `<div class="sec-head"><h2 id="h-${s.key}"></h2><p></p><span class="slot" id="slot-${s.key}"></span></div><div class="grid"></div>`;
    sec.querySelector("h2").textContent = s.heading;
    sec.querySelector("p").textContent = s.blurb;
    const grid = sec.querySelector(".grid");
    for (const o of s.options) {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.key = s.key;
      card.dataset.id = o.id;
      const screen = document.createElement("div");
      screen.className = "screen";
      if (o.src) {
        const v = document.createElement("video");
        v.src = o.src; v.controls = true; v.preload = "metadata"; v.playsInline = true;
        screen.append(v);
      } else {
        screen.innerHTML = `<div class="pending"><div class="bars"><span></span><span></span><span></span></div>Still rendering…<br>refresh in a minute</div>`;
      }
      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = `<span class="letter"></span><span class="name"></span>`;
      label.querySelector(".letter").textContent = o.id;
      label.querySelector(".name").textContent = o.name;
      const desc = document.createElement("p");
      desc.className = "desc"; desc.textContent = o.desc;
      const btn = document.createElement("button");
      btn.className = "pick"; btn.type = "button"; btn.id = `pick-${s.key}-${o.id}`;
      btn.textContent = `Pick ${o.id}`;
      btn.addEventListener("click", () => choose(s.key, o.id));
      const stamp = document.createElement("span");
      stamp.className = "stamp"; stamp.textContent = "PICKED ★";
      card.append(stamp, screen, label, desc, btn);
      grid.append(card);
    }
    root.append(sec);
  }
}

function render() {
  document.querySelectorAll(".card").forEach(c => {
    const on = picks[c.dataset.key] === c.dataset.id;
    c.classList.toggle("picked", on);
    c.querySelector(".pick").textContent = on ? `Picked ${c.dataset.id}` : `Pick ${c.dataset.id}`;
  });
  for (const k of ["title", "channel", "signal", "voice"]) {
    document.getElementById(`d-${k}`).textContent = optionName(k, picks[k]);
    document.getElementById(`slot-${k}`).textContent = picks[k] ? `Picked: ${optionName(k, picks[k])}` : "";
  }
  const note = document.getElementById("note");
  if (document.activeElement !== note && note.value !== picks.note) note.value = picks.note || "";
}

// ---- saving (db capability); the page still works locally without it ----
let doc = null;
let writing = Promise.resolve();
function save() {
  if (!doc) { statusEl.textContent = "Saving is unavailable here, so tell Claude your picks"; return; }
  statusEl.textContent = "Saving…";
  const body = { ...picks, updatedAt: new Date().toISOString() };
  writing = writing.then(() => doc.set(body)).then(
    () => { statusEl.textContent = "Saved. Claude can see your picks"; },
    () => { statusEl.textContent = "Couldn't save. Try again, or tell Claude"; });
}

function choose(key, id) {
  picks[key] = picks[key] === id ? null : id;
  render();
  save();
}

let noteTimer = null;
document.getElementById("note").addEventListener("input", e => {
  picks.note = e.target.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(save, 900);
});

build();
render();

(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) { statusEl.textContent = "Picks show here; tell Claude which you chose"; return; }
  doc = db.doc("choices/family");
  doc.onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data() || {};
    for (const k of ["title", "channel", "signal", "voice"]) picks[k] = d[k] ?? null;
    if (document.activeElement !== document.getElementById("note")) picks.note = d.note || "";
    render();
  }, () => { statusEl.textContent = "Live updates stopped. Refresh the page"; });
})();
</script>
